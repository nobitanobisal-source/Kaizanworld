<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaizan World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D world, HUD panels pinned to the edges, build tools in a bottom bar. */
:root {
  --bg: #9fd0f5;
  --panel: rgba(14, 22, 44, .8);
  --panel-line: rgba(255, 255, 255, .14);
  --fg: #f4f7ff;
  --muted: #a9b6d6;
  --accent: #f5c518;
  --accent-ink: #1b1600;
  --danger: #ff5a4d;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--body); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.stick, .jump { pointer-events: auto; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; backdrop-filter: blur(6px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand { top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.brand h1 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); color: #fff; }
.chip { padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 999px; color: var(--fg); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5ee08a; margin-right: 6px; }
.chip.off i { background: var(--muted); }

.players { top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); width: 168px; padding: 8px 10px; font-size: 13px; }
.players h2 { margin: 0 0 4px; font: 600 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.players ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.players li { display: flex; align-items: center; gap: 7px; min-width: 0; }
.players li span.sw { flex: none; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255, 255, 255, .5); }
.players li span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players li em { color: var(--muted); font-style: normal; }

.chat { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--tb, 70px) + env(safe-area-inset-bottom, 0px) + 16px); width: min(360px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 6px; }
.log { display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow: hidden; justify-content: flex-end; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); pointer-events: none; }
.log .line { color: #fff; background: rgba(10, 16, 34, .5); border-radius: 6px; padding: 2px 8px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; transition: opacity .6s; }
.log .line b { font-weight: 600; }
.log .line.faded { opacity: 0; }
.chat:focus-within .log .line.faded { opacity: 1; }
.chat input { width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--panel-line); background: var(--panel); color: var(--fg); font: inherit; -webkit-user-select: text; user-select: text; }
.chat input::placeholder { color: var(--muted); }

.toolbar { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: calc(100vw - 32px); padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.group { display: flex; gap: 4px; align-items: center; }
.group + .group { padding-left: 8px; border-left: 1px solid var(--panel-line); }
.btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--panel-line); background: rgba(255, 255, 255, .06); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: rgba(255, 255, 255, .14); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); color: #fff; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.sw { width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255, 255, 255, .35); padding: 0; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.only-touch { display: none; }

.toast { top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 13px; max-width: calc(100vw - 32px); text-align: center; pointer-events: none !important; transition: opacity .3s; }
.toast[hidden] { display: none; }

.stick { left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(var(--tb, 70px) + env(safe-area-inset-bottom, 0px) + 28px); width: 112px; height: 112px; border-radius: 50%; background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .35); display: none; touch-action: none; }
.stick .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, .7); pointer-events: none; }
.jump { right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tb, 70px) + env(safe-area-inset-bottom, 0px) + 36px); width: 84px; height: 84px; border-radius: 50%; background: rgba(245, 197, 24, .85); color: var(--accent-ink); font: 700 15px var(--display); border: 2px solid rgba(255, 255, 255, .6); display: none; touch-action: none; }

.topbar { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
.topbar .btn { background: var(--panel); }
.coins { display: flex; gap: 7px; align-items: center; padding: 6px 12px; border-radius: 999px; font: 600 14px var(--body); background: var(--panel); border: 1px solid var(--panel-line); font-variant-numeric: tabular-nums; }
.coin { width: 16px; height: 16px; flex: none; border-radius: 50%; display: inline-block; background: radial-gradient(circle at 35% 30%, #fff3b0, #f5c518 55%, #b88a00); box-shadow: inset 0 0 0 2px rgba(120, 80, 0, .5); }
.inhub .toolbar, .inhub .hint, .inhub .stick, .inhub .jump, .inhub .chat, .inhub .topbar, .inhub .players { display: none; }
.toast { z-index: 20; }

/* hub: light mobile-app style screens, bottom navigation */
.hub { --h-bg: #ffffff; --h-ink: #191b22; --h-mute: #6a6e7a; --h-soft: #f2f3f5; --h-line: #e3e5ea; --h-blue: #335fff;
  inset: 0; z-index: 10; display: flex; justify-content: flex-end; align-items: stretch; box-sizing: border-box; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) 16px; }
.hub[hidden] { display: none; }
.hpanel { pointer-events: auto; width: min(460px, 100%); display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--h-bg); color: var(--h-ink); border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); }
.hscreen { flex: 1; min-height: 0; position: relative; }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 24px; touch-action: pan-y; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
.scr.av { padding: 0; overflow: hidden; }
.hnav { display: flex; border-top: 1px solid var(--h-line); background: var(--h-bg); padding-bottom: 2px; }
.hnav button { flex: 1; border: 0; background: none; padding: 8px 2px 7px; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; font-weight: 500; color: var(--h-mute); }
.hnav button[aria-pressed="true"] { color: var(--h-ink); font-weight: 700; }
.hnav .ic, .hnav canvas { width: 26px; height: 26px; }
.hnav canvas { border-radius: 50%; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
.ic circle[r="1.6"] { fill: currentColor; stroke: none; }
.hhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.wm { font: 700 28px/1 var(--display); letter-spacing: .01em; color: var(--h-ink); }
.wm i { font-style: normal; color: #d99a00; }
.hub .coins { background: var(--h-soft); color: var(--h-ink); border-color: var(--h-line); }
.prow { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.prow canvas, .fr canvas { border-radius: 50%; display: block; }
.prow b { font: 600 20px var(--display); }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; font: 700 18px var(--display); }
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; margin: 0 -16px 8px; padding-left: 16px; padding-right: 16px; touch-action: pan-x pan-y; }
.fr { flex: none; width: 84px; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--h-ink); }
.fr .circ { width: 80px; height: 80px; border-radius: 50%; background: var(--h-soft); display: grid; place-items: center; position: relative; overflow: hidden; }
.fr .circ .ic { width: 30px; height: 30px; color: var(--h-mute); }
.fr .dot { position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; border-radius: 50%; background: #2fcf6b; border: 3px solid #fff; }
.fr .nm { font-weight: 600; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr .st { color: var(--h-mute); font-size: 11.5px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.games { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gt { padding: 0; border: 0; background: none; text-align: left; color: var(--h-ink); display: grid; gap: 6px; align-content: start; }
.gt canvas { width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; display: block; background: var(--h-soft); }
.gt b { font: 600 14px/1.25 var(--display); }
.gt span, .trow span.cnt { font-size: 12.5px; color: var(--h-mute); display: flex; align-items: center; gap: 5px; }
.gt:hover canvas, .trow:hover canvas { filter: brightness(1.05); }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fcf6b; }
.trow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--h-line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--h-ink); }
.trow .rk { width: 22px; font: 700 18px var(--display); color: var(--h-mute); text-align: center; }
.trow canvas { width: 112px; aspect-ratio: 16 / 10; border-radius: 10px; display: block; }
.trow .tx { flex: 1; min-width: 0; display: grid; gap: 3px; }
.trow b { font: 600 15px var(--display); }
.pbtn { border: 0; border-radius: 10px; background: var(--h-blue); color: #fff; font: 600 14px var(--body); padding: 9px 16px; }
.pbtn:disabled { background: #c9ccd6; color: #fff; }
.pbtn.grey { background: var(--h-soft); color: var(--h-ink); }
.hub h2 { margin: 0 0 14px; font: 700 24px/1.2 var(--display); }
.hub .sub { color: var(--h-mute); margin: 0 0 14px; }
/* avatar screen */
.avwrap { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
.avtop { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.avtop .back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--h-soft); color: var(--h-ink); display: grid; place-items: center; }
.avtop .back .ic { width: 22px; height: 22px; }
.seg { flex: 1; display: flex; background: var(--h-soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; border-radius: 9px; padding: 8px 4px; background: none; font: 600 14px var(--body); color: var(--h-mute); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--h-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.avmid { flex: 1; }
.sheet { pointer-events: auto; flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--h-bg); }
.sbody { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 14px; touch-action: pan-y; }
.cats { display: flex; gap: 4px; overflow-x: auto; padding: 4px 12px 0; border-bottom: 1px solid var(--h-line); flex: none; touch-action: pan-x pan-y; }
.cats button { flex: none; border: 0; background: none; padding: 12px 10px 10px; font: 600 15px var(--body); color: var(--h-mute); border-bottom: 3px solid transparent; }
.cats button[aria-pressed="true"] { color: var(--h-ink); border-bottom-color: var(--h-ink); }
.sbody h3 { margin: 14px 0 10px; font: 700 18px var(--display); text-transform: none; letter-spacing: 0; color: var(--h-ink); }
.igrid { display: grid; gap: 12px 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.itm { padding: 0; border: 0; background: none; text-align: left; color: var(--h-ink); display: grid; gap: 4px; align-content: start; min-width: 0; }
.itm canvas { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; outline: 3px solid transparent; outline-offset: -3px; }
.itm[aria-pressed="true"] canvas { outline-color: var(--h-blue); }
.itm b { font: 600 13px/1.25 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.itm .cr { font-size: 12px; color: var(--h-mute); }
.itm .pr { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
.itm .pr.own { color: var(--h-mute); font-weight: 500; }
.abar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--h-line); background: var(--h-bg); }
.abar .tx { flex: 1; min-width: 0; display: grid; }
.abar .tx b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.abar .tx span { font-size: 12.5px; color: var(--h-mute); }
.field { display: grid; gap: 6px; margin-bottom: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--h-mute); }
.field input, .sendrow input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--h-line); background: var(--h-soft); color: var(--h-ink); font: 500 16px var(--body); -webkit-user-select: text; user-select: text; min-width: 0; }
.hub .swatches { justify-content: flex-start; margin: 8px 0 4px; }
.hub .sw { width: 34px; height: 34px; border-color: rgba(0, 0, 0, .18); }
.hub .sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px var(--h-blue); }
.wearrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--h-line); }
.wearrow .k { width: 74px; font-size: 12px; color: var(--h-mute); text-transform: uppercase; letter-spacing: .05em; }
.wearrow .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.wearrow .pbtn { padding: 6px 12px; font-size: 13px; }
.msgs { display: grid; gap: 6px; align-content: start; }
.msg { background: var(--h-soft); border-radius: 12px; padding: 8px 12px; overflow-wrap: anywhere; }
.msg b { font-weight: 700; margin-right: 6px; }
.sendrow { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--h-line); }
.sendrow input { flex: 1; }
.chatwrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.chatwrap .sbody { padding-top: 14px; }
.mgrid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mt { border: 0; border-radius: 14px; background: var(--h-soft); color: #3a3d4a; padding: 22px 8px 18px; display: grid; justify-items: center; gap: 12px; font: 600 15px var(--body); }
.mt .ic { width: 44px; height: 44px; stroke-width: 1.6; }
.mt:hover { background: #e9eaee; }
.backrow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.backrow .back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--h-soft); color: var(--h-ink); display: grid; place-items: center; }
.backrow .back .ic { width: 22px; height: 22px; }
.backrow h2 { margin: 0; }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stat { background: var(--h-soft); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font: 700 20px var(--display); }
.stat span { font-size: 12px; color: var(--h-mute); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--h-line); }
.setrow small { display: block; color: var(--h-mute); }
.hrow { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--h-line); }
.hrow kbd { font: 600 12px var(--body); padding: 2px 7px; border-radius: 5px; background: var(--h-soft); border: 1px solid var(--h-line); white-space: nowrap; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: #d3d5db; margin: 0 auto 14px; }
.sheet.prof { flex: 0 0 auto; padding: 10px 16px 18px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.pill { background: var(--h-soft); border-radius: 999px; padding: 9px 16px; font: 600 15px var(--body); color: #3a3d4a; }
.acts { display: flex; gap: 8px; }
.acts .pbtn { padding: 14px 12px; font-size: 15px; flex: 1; }
.acts .pbtn:first-child { flex: 1.5; }
.acts .pbtn.qr { flex: 0 0 52px; padding: 0; display: grid; place-items: center; }
.acts .pbtn.qr .ic { width: 24px; height: 24px; }
.empty { color: var(--h-mute); padding: 18px 0; text-align: center; }
@media (max-width: 720px) {
  .inhub .brand { display: none; }
  .hub { padding: 0; }
  .hpanel { width: 100%; border-radius: 0; box-shadow: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .hub[data-tab="avatar"] .hpanel { background: transparent; pointer-events: none; }
  .hub[data-tab="avatar"] .hnav { pointer-events: auto; }
  .hub[data-tab="avatar"] .avtop { padding-top: 12px; }
  .hub[data-tab="avatar"] .seg, .hub[data-tab="avatar"] .coins, .hub[data-tab="avatar"] .back { background: rgba(255, 255, 255, .92); }
  .sheet { flex: 0 0 58%; border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(0, 0, 0, .18); }
}
@media (max-width: 520px) { .topbar { top: calc(env(safe-area-inset-top, 0px) + 56px); } .toast { top: calc(env(safe-area-inset-top, 0px) + 104px); } }
@media (pointer: coarse) {
  .stick, .jump { display: block; }
  .only-touch { display: inline-block; }
  .hint { display: none; }
  .chat { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 100px); width: min(300px, calc(100vw - 200px)); }
  .chat .log { max-height: 110px; }
  .chat input { display: none; }
  .chat.open input { display: block; }
  .players { width: 130px; }
}
@media (max-width: 520px) { .players { width: 118px; font-size: 12px; } .brand h1 { font-size: 22px; } }

.hint { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tb, 70px) + env(safe-area-inset-bottom, 0px) + 16px); padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.hint kbd { font: 600 11px var(--body); padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, .12); color: var(--fg); }

.start { inset: 0; display: grid; place-items: center; background: rgba(8, 14, 32, .45); padding: 16px; box-sizing: border-box; }
.start[hidden] { display: none; }
.card { width: min(420px, 100%); box-sizing: border-box; padding: 24px; display: grid; gap: 14px; background: rgba(14, 22, 44, .92); }
.card h1 { margin: 0; font: 700 44px/1 var(--display); letter-spacing: .02em; color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .4); }
.card h1 span { color: var(--accent); }
.card p { margin: 0; color: var(--muted); text-wrap: pretty; }
.card label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card input[type=text] { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--panel-line); background: rgba(255, 255, 255, .08); color: var(--fg); font: 500 16px var(--body); -webkit-user-select: text; user-select: text; }
.card .swatches { justify-content: flex-start; margin-top: 8px; }
.card .sw { width: 32px; height: 32px; }
.play { padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 20px var(--display); letter-spacing: .03em; }
.play:hover { filter: brightness(1.06); }
.note { font-size: 12px; color: var(--muted); }
.fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); color: #10203a; }
</style>

<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<div id="app" class="inhub">
  <canvas id="gl" tabindex="0" aria-label="3D world"></canvas>

  <div class="hud brand">
    <h1>Kaizan World</h1>

<script>
/* Connects the game to server.js over WebSocket. Gives the page the same small API it uses inside Claude. */
(function () {
  if (window.claude) return;
  var url = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws';
  var ws = null, myId = null, local = {}, peers = [], snap = [], peerCbs = [], brickCbs = [], bricks = new Map(), gotHello = false, isOpen = false, tries = 0, waiters = [];
  function send(o) { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(o)); } catch (e) {} } }
  function emitPeers() {
    snap = peers.map(function (q) { return { peer: q.id, sameTab: q.id === myId, isMe: q.id === myId, kind: 'viewer', guest: false, by: null, presence: q.p, updatedAt: Date.now() }; });
    peerCbs.forEach(function (cb) { try { cb({ peers: snap, joined: snap, left: [], updated: [] }); } catch (e) {} });
  }
  function change(type, id, d) { return { type: type, doc: { id: id, exists: type !== 'removed', data: function () { return d; } }, oldIndex: -1, newIndex: -1 }; }
  function emitBricks(list, only) {
    var targets = only ? [only] : brickCbs;
    targets.forEach(function (cb) { try { cb({ docChanges: function () { return list; } }); } catch (e) {} });
  }
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { return; }
    ws.onopen = function () { isOpen = true; tries = 0; waiters.splice(0).forEach(function (r) { r(true); }); };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hello') {
        myId = m.id; gotHello = true; bricks = new Map(m.bricks);
        emitBricks(m.bricks.map(function (b) { return change('added', b[0], b[1]); }));
        if (Object.keys(local).length) send({ t: 'p', d: local });
      } else if (m.t === 'peers') { peers = m.list; emitPeers(); }
      else if (m.t === 'bset') { bricks.set(m.id, m.d); emitBricks([change('added', m.id, m.d)]); }
      else if (m.t === 'bdel' || m.t === 'bnack') { bricks.delete(m.id); emitBricks([change('removed', m.id, {})]); }
    };
    ws.onclose = function () { isOpen = false; gotHello = false; peers = []; emitPeers(); tries++; setTimeout(connect, Math.min(8000, 500 * tries)); };
    ws.onerror = function () {};
  }
  var room = {
    presence: function (patch) { Object.keys(patch).forEach(function (k) { if (patch[k] === null) delete local[k]; else local[k] = patch[k]; }); send({ t: 'p', d: patch }); return Promise.resolve(); },
    onPeers: function (cb) { peerCbs.push(cb); if (snap.length) setTimeout(function () { cb({ peers: snap, joined: snap, left: [], updated: [] }); }, 0); return function () { peerCbs = peerCbs.filter(function (f) { return f !== cb; }); }; },
    peers: function () { return snap; }

  var db = {
    collection: function (path) {
      if (path !== 'bricks') return { doc: localDoc, onSnapshot: function () { return function () {}; } };
      return {
        onSnapshot: function (cb) {
          brickCbs.push(cb);
          if (gotHello) { var l = []; bricks.forEach(function (d, id) { l.push(change('added', id, d)); }); emitBricks(l, cb); }
          return function () { brickCbs = brickCbs.filter(function (f) { return f !== cb; }); };
        },
        doc: function (id) { return { set: function (d) { send({ t: 'bset', id: id, d: d }); return Promise.resolve(); }, delete: function () { send({ t: 'bdel', id: id }); return Promise.resolve(); }, get: localDoc().get }; }
      };
    }
  };
  var uid = null; try { uid = localStorage.getItem('by.uid'); if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 12); localStorage.setItem('by.uid', uid); } } catch (e) { uid = 'u' + Math.random().toString(36).slice(2, 12); }
  var user = { id: function () { return Promise.resolve(uid); } };
  function waitOpen() { if (isOpen) return Promise.resolve(true); return new Promise(function (res) { waiters.push(res); setTimeout(function () { res(isOpen); }, 5000); }); }
  window.claude = {
    use: function (n) {
      if (n === 'user') return Promise.resolve(user);
      if (n !== 'room' && n !== 'db') return Promise.resolve(null);
      return waitOpen().then(function (ok) { return ok ? (n === 'room' ? room : db) : null; });
    }
  };
  connect();
})();
